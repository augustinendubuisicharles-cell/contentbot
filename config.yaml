# ContentBot configuration. Secrets never go here: they come from environment
# variables (see .env.example) or GitHub Actions secrets.

brand:
  name: "Daily Brief"            # shown on every frame of the video
  handle: "@yourhandle"          # shown in the outro card
  accent_color: "#E63946"
  # Said at the end of every video. A fixed sign-off becomes the show's catchphrase.
  signoff: "That's the news, minus the boring bits. See you next time."

# Your local time zone. Used for the date on screen and for the posting report.
# The GitHub Actions schedule itself is in UTC; see README "Schedule".
timezone: "UTC"

editions:
  morning:
    lookback_hours: 12           # overnight news
    greeting: "Good morning"
  evening:
    lookback_hours: 12           # the day's news
    greeting: "Good evening"

video:
  max_seconds: 60
  stories: 5                     # stories per report
  width: 1080
  height: 1920
  fps: 30
  # Main voice: Kokoro, free and natural-sounding, runs on the GitHub server.
  # British: bf_emma, bf_isabella, bf_alice, bf_lily (female), bm_george, bm_fable, bm_lewis (male).
  # American: af_heart, af_bella, am_michael. Leave empty to use the backup voice only.
  kokoro_voice: "bf_emma"
  speed: 1.05
  # Backup voice if Kokoro isn't available: any edge-tts voice.
  voice: "en-GB-SoniaNeural"
  background_music: ""           # optional path to a royalty-free track, mixed quietly under the voice

writer:
  model: "claude-opus-5-5"
  effort: "medium"               # a little more thought for the jokes to land
  style: >-
    Witty, warm and gripping, like a sharp British presenter who loves the news and doesn't take
    herself too seriously. Open with a hook that makes people stop scrolling. Give each story a
    punchy first line, and add a dry, clever quip, wordplay or wry observation where it fits so
    viewers smile or laugh. Keep it conversational and quick, British spelling and phrasing.

sources:
  # Any RSS/Atom feed works: news sites, blogs, newsletters, YouTube channels.
  rss:
    - https://feeds.bbci.co.uk/news/world/rss.xml
    - https://www.aljazeera.com/xml/rss/all.xml
    - https://feeds.npr.org/1001/rss.xml
    - https://www.theguardian.com/world/rss
    - https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
    - https://techcrunch.com/feed/
    - https://feeds.arstechnica.com/arstechnica/index
  # Reddit blocks requests from GitHub Actions servers, so it's off by default.
  # Add subreddit names here if you run ContentBot from your own machine.
  reddit: []
  x:
    # Needs X_BEARER_TOKEN (X API Basic tier or above). Skipped when unset.
    queries:
      - "breaking news -is:retweet lang:en"
    min_likes: 200
  trends:
    # Google Trends daily trending searches; stories matching a trend get boosted.
    geo: "US"

images:
  # Only openly licensed images (Creative Commons / public domain) from
  # Openverse and Wikimedia Commons. Credits go in every post description.
  commercial_only: true

platforms:
  youtube: true
  facebook: true
  instagram: true
  tiktok: true

tiktok:
  # "draft": video goes to your TikTok inbox and you tap to publish (works before TikTok's audit).
  # "direct": posts publicly by itself (only after TikTok approves your app).
  mode: "direct"
  # Must match a redirect URI registered in your TikTok developer app.
  redirect_uri: "https://augustinendubuisicharles-cell.github.io/contentbot/"

growth:
  first_comment: true            # post a sources + discussion-question comment on FB and IG
  max_hashtags: 8

clips:
  # Paid clipping campaigns (Whop Content Rewards, Vyro): python -m contentbot.clips, or the
  # "Make campaign clips" workflow. Only clip footage the campaign gives you permission to use.
  count: 5                       # clips per run
  min_seconds: 20
  max_seconds: 60
  layout: "blur"                 # blur: whole frame over a blurred fill; crop: fill the screen with the middle
  disclosure: "#ad"              # added to every caption; most campaign briefs require it
  on_screen_label: "#ad"         # small label in the corner of the video; set to "" to hide
  whisper_model: "base"          # free speech-to-text: tiny, base, small (slower, more accurate)
  max_source_minutes: 120        # only the first part of very long videos is transcribed
  effort: "medium"
