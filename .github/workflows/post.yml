name: Post news report

on:
  schedule:
    # Times are UTC. Set these to your morning and evening in your own time zone.
    # Example for 07:00 and 19:00 in UTC+1: "0 6 * * *" and "0 18 * * *".
    - cron: "0 6 * * *"    # morning edition
    - cron: "0 18 * * *"   # evening edition
    - cron: "30 23 * * 0"  # weekly performance report (Sunday)
  workflow_dispatch:
    inputs:
      edition:
        description: "morning, evening, report, tiktok-auth, or tiktok-check"
        default: "morning"
      code:
        description: "Only for tiktok-auth: the code from TikTok's sign-in page"
        default: ""
      dry_run:
        description: "Build the video without posting"
        type: boolean
        default: false

permissions:
  contents: write   # to commit data/posts.jsonl and data/report.md back

concurrency:
  group: contentbot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core espeak-ng
      # CPU-only PyTorch for the Kokoro voice (much smaller than the default GPU build).
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Cache the voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1

      - name: Restore TikTok sign-in
        uses: actions/cache/restore@v4
        with:
          path: data/.tiktok_token.json
          key: tiktok-token-${{ github.run_id }}
          restore-keys: tiktok-token-

      - name: Pick edition
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "edition=${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ]; then
            echo "edition=morning" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 18 * * *" ]; then
            echo "edition=evening" >> "$GITHUB_OUTPUT"
          else
            echo "edition=report" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and post
        if: steps.pick.outputs.edition == 'morning' || steps.pick.outputs.edition == 'evening'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m contentbot run --edition "${{ steps.pick.outputs.edition }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Connect TikTok
        if: steps.pick.outputs.edition == 'tiktok-auth'
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: |
          CODE=$(jq -r '.inputs.code' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$CODE"
          python -m contentbot tiktok-auth --code "$CODE"

      - name: Check TikTok
        if: steps.pick.outputs.edition == 'tiktok-check'
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: python -m contentbot tiktok-check --publish-id "${{ inputs.code }}"

      - name: Save TikTok sign-in
        if: always() && hashFiles('data/.tiktok_token.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/.tiktok_token.json
          key: tiktok-token-${{ github.run_id }}

      - name: Performance report
        if: steps.pick.outputs.edition == 'report'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
        run: python -m contentbot report

      - name: Keep the video as a download
        if: always() && (steps.pick.outputs.edition == 'morning' || steps.pick.outputs.edition == 'evening')
        uses: actions/upload-artifact@v5
        with:
          name: report-${{ steps.pick.outputs.edition }}-${{ github.run_id }}
          path: |
            out/**/report.mp4
            out/**/script.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Save post log
        if: always()
        run: |
          git config user.name "contentbot"
          git config user.email "contentbot@users.noreply.github.com"
          git add data/ || true
          git diff --cached --quiet || (git commit -m "Update post log" && git push)
