name: Make campaign clips

# Run from the Actions tab (or the GitHub app): paste a clipping campaign's video link and its brief.
# The clips come back as a release on this repo, so you can download them straight to your phone.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Campaign video link (Google Drive, Dropbox, direct .mp4, or any link yt-dlp supports)"
        required: true
      brief:
        description: "Paste the campaign's rules / brief"
        default: ""
      name:
        description: "Campaign name"
        default: "campaign"
      count:
        description: "How many clips"
        default: "5"
      layout:
        description: "blur (whole frame over a blurred fill) or crop (fill the screen, for one person talking)"
        default: "blur"

permissions:
  contents: write   # to publish the clips as a release

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: pip install -r requirements-clips.txt
      - name: Cache the speech-to-text model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: faster-whisper-v1

      - name: Make clips
        id: clips
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          URL: ${{ inputs.url }}
          BRIEF: ${{ inputs.brief }}
          NAME: ${{ inputs.name }}
          COUNT: ${{ inputs.count }}
          LAYOUT: ${{ inputs.layout }}
        run: |
          DIR=$(python -m contentbot.clips --url "$URL" --brief "$BRIEF" --name "$NAME" --count "$COUNT" --layout "$LAYOUT" | tail -1)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          cat "$DIR/post.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish clips for download
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ inputs.name }}
        run: |
          DIR="${{ steps.clips.outputs.dir }}"
          gh release create "clips-${{ github.run_id }}" "$DIR"/clip*.mp4 "$DIR/post.md" \
            --prerelease --title "Clips: $NAME" --notes-file "$DIR/post.md"
